name: release

# On every published GitHub release:
#  - attach the runnable jars (MCP server, console, web server) to the release, and
#  - publish the Docker image to ghcr.io/vlad-public-code/valem:<tag> and :latest,
# so "docker run" and "download the jar" work for anyone who finds the project.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build, e.g. v1.1.0"
        required: true

permissions:
  contents: write        # upload assets to the release
  packages: write        # push the image to GHCR

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  jars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # tracked-json and jsonata-jvm-compiler resolve from Maven Central (versions pinned in pom.xml).
      - name: Build the runnable jars
        run: mvn -B -q package -DskipTests -pl valem-mcp,valem-console,valem-web -am

      - name: Attach jars to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pick() { ls "$1"/target/"$1"-*.jar | grep -v -e original -e sources -e javadoc | head -1; }
          cp "$(pick valem-mcp)" valem-mcp.jar
          cp "$(pick valem-console)" valem-console.jar
          cp "$(pick valem-web)" valem-web.jar
          gh release upload "$TAG" valem-mcp.jar valem-console.jar valem-web.jar --clobber

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/vlad-public-code/valem
          tags: |
            type=raw,value=${{ env.TAG }}
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
