spring:
  threads:
    virtual:
      enabled: true
  # StorageConfig owns DataSource creation (it synthesizes a pooled HikariDataSource only when a DB
  # backend is selected). Exclude Boot's JDBC auto-config so merely having HikariCP on the classpath
  # does not force a dataSource bean from empty spring.datasource.*.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.JdbcTemplateAutoConfiguration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus   # /actuator/{health,info,metrics,prometheus}
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: valem
  prometheus:
    metrics:
      export:
        enabled: true
  jackson:
    mapper:
      accept-case-insensitive-enums: true
  servlet:
    multipart:
      max-file-size: 50MB        # hard cap on a single uploaded part (do not rely on defaults)
      max-request-size: 55MB     # cap on the whole multipart request

valem:
  limits:
    # Max compiled-JSONata-expression entries (bounded LRU, shared process-wide). Each entry pins a
    # generated class + its classloader in Metaspace — native memory a container's heap cap does not
    # cover — so this bound decides the process's Metaspace footprint. Values below 64 are floored;
    # eviction is safe (an evicted expression recompiles on next use). Bridged into the JVM system
    # property valem-core reads by CoreLimitsEnvironmentPostProcessor; see
    # docs/deployment/configuration.md for sizing guidance.
    expression-cache-size: ${VALEM_LIMITS_EXPRESSION_CACHE_SIZE:500}
    # Wall-clock budget for ONE expression evaluation; 0 disables. Derivations, constraints and
    # effect triggers are evaluated inside the model lock, so a non-terminating expression does not
    # merely fail a request — it holds the lock, and where Loom gives parallelism 1 it can wedge the
    # service. Bounding it turns that into one failed field (null value + an error trace). Real
    # expressions run in single-digit milliseconds; the deadline is wall-clock, so a pathologically
    # loaded host can time out a normally-fast expression — raise it, or set 0, if that happens.
    expression-timeout-ms: ${VALEM_LIMITS_EXPRESSION_TIMEOUT_MS:2000}
    # Max compiled-library entries (bounded LRU, shared process-wide, content-addressed on the
    # definition + the model's constants + signature overrides). One library = one generated class,
    # so this bounds Metaspace exactly as expression-cache-size does. Values below 4 are floored.
    library-cache-size: ${VALEM_LIMITS_LIBRARY_CACHE_SIZE:64}
    library-max-chars:   ${VALEM_LIMITS_LIBRARY_MAX_CHARS:20000}    # per definition expression
    library-max-exports: ${VALEM_LIMITS_LIBRARY_MAX_EXPORTS:64}     # above this, a warning
    library-max-layers:  ${VALEM_LIMITS_LIBRARY_MAX_LAYERS:8}       # own + inherited layers
  blob-store: memory           # memory | filesystem
  blob-store-path: ${user.home}/.valem/blobs
  blob:
    max-bytes: 52428800        # per-blob upload cap enforced by BlobController (50 MB)
    max-total-bytes: 536870912 # in-memory store total-bytes ceiling (512 MB); <=0 = unbounded (warned)
  rate-limit:
    enabled: false             # optional per-IP rate limiting (off by default)
    requests: 100              # requests allowed per window per client IP
    window-seconds: 60         # sliding window length
    trust-forwarded-for: false # only trust X-Forwarded-For behind a trusted proxy
  effects:
    allow-private-ips: false   # relax the egress guard's address checks (local dev / IT stubs only)
    allow-insecure-http: false # permit cleartext http egress (independent of allow-private-ips)
    allowed-hosts:             # optional comma-separated egress allowlist (blank = any public host)
    max-response-bytes: 1048576 # max bytes an http effect will fold back (streamed, bounded)
  llm:
    provider: anthropic      # anthropic | openai | ollama | openrouter | groq | mistral | gemini | cerebras
    api-key: ${VALEM_LLM_API_KEY:}   # empty = LLM features disabled (not required for ollama)
    model: ${VALEM_LLM_MODEL:}   # blank = provider-appropriate default (anthropic→claude-sonnet-4-6, openai→gpt-4o, …); set to override
    max-tokens: 8192
    max-retries: 6             # base validation-repair attempts (each repair can re-test via eval_jsonata)
    max-retries-hard: 10       # ceiling for a converging hard spec (extra attempts only while errors keep dropping)
    generation-temperature: 0.0  # sampling temperature for the initial attempt (low = deterministic, structured)
    structured-output:
      enabled: true              # send the ModelSpec/SpecEvolution JSON Schema as response_format (OpenAI-compatible providers)
    max-concurrent-requests: 1 # cap simultaneous LLM calls (0 = unlimited, 1 = serialise); avoids 429s on throttled keys
    base-url:                  # optional: override default endpoint (e.g. http://localhost:11434/v1 for custom ollama)
