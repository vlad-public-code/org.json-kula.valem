# Smithery listing for valem-mcp — https://smithery.ai/docs
# Local stdio server: the client launches the jar and speaks MCP over stdin/stdout.
# The jar (valem-mcp.jar) must be present next to where the command runs — build it with
# `mvn package -pl valem-mcp` or download it from the GitHub release.
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      url:
        type: string
        title: Remote server URL
        description: >-
          Drive a remote valem-web server for durable, shared state. Leave blank to run
          embedded and in-memory (zero config, offline).
      apiKey:
        type: string
        title: API key
        description: API key for the remote valem-web server (only used together with url).
    required: []
  commandFunction: |-
    (config) => ({
      command: 'java',
      args: ['-jar', 'valem-mcp.jar'].concat(config.url ? ['--url', config.url] : []),
      env: config.apiKey ? { VALEM_API_KEY: config.apiKey } : {}
    })
  exampleConfig:
    url: ""
    apiKey: ""
